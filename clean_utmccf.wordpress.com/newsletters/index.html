<!DOCTYPE html>
<html style="margin-top: 0px !important; scroll-padding-top: 0px !important;"  lang="en">
<head>
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/cn2t.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    try {
        var converter = OpenCC.Converter({ from: 'cn', to: 'tw' });
        var buttons = document.querySelectorAll(".simplified_to_traditional_translation a");
        if (!buttons || buttons.length === 0) return;
        
        var translatePage = function() {
            var rootNode = document.documentElement;
            rootNode.lang = 'zh-CN';
            var HTMLDict = OpenCC.HTMLConverter(converter, rootNode, 'zh-CN', 'zh-TW');
            HTMLDict.convert();
            buttons.forEach(function(btn) {
                btn.textContent = "简体";
                btn.onclick = function(e) {
                    e.preventDefault();
                    localStorage.setItem("lang_pref", "cn");
                    HTMLDict.restore();
                    buttons.forEach(function(b) {
                        b.textContent = "繁體";
                        b.onclick = function(e2) {
                            e2.preventDefault();
                            localStorage.setItem("lang_pref", "tw");
                            translatePage();
                        };
                    });
                };
            });
        };

        buttons.forEach(function(btn) {
            btn.href = "#";
            btn.onclick = function(e) {
                e.preventDefault();
                localStorage.setItem("lang_pref", "tw");
                translatePage();
            };
        });

        var pref = localStorage.getItem("lang_pref");
        if (pref === "tw") {
            translatePage();
        } else if (!pref) {
            var langs = navigator.languages || [navigator.language];
            for (var i = 0; i < langs.length; i++) {
                var lang = langs[i].toLowerCase();
                if (lang.includes("zh-tw") || lang.includes("zh-hk") || lang.includes("zh-hant") || lang.includes("zh-mo")) {
                    translatePage();
                    break;
                } else if (lang.includes("zh-cn") || lang.includes("zh-sg") || lang.includes("zh-hans")) {
                    break;
                }
            }
        }
    } catch (e) {
        console.error("OpenCC translation error: ", e);
    }
});
</script>
<link rel="stylesheet" href="/extra.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter</title>
</head>

<body style="margin-top: 0px !important;" >
    <img id="newsletter" width="100%" alt="Newsletter Image" />
    <script>
        function getFridayDate(offsetWeeks = 0) {
            const today = new Date();
            const dayOfWeek = today.getDay();
            const daysUntilFriday = (5 - dayOfWeek + 7) % 7;
            const friday = new Date(today);
            friday.setDate(today.getDate() + daysUntilFriday + (offsetWeeks * 7));
            return friday;
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}${month}${day}`;
        }

        function loadNewsletterImage(offsetWeeks = 0, formatIndex = 0) {
            const formats = ['jpg', 'png', 'webp'];
            const fridayDate = getFridayDate(offsetWeeks);
            const formattedDate = formatDate(fridayDate);
            const imageUrl = `${formattedDate}.${formats[formatIndex]}`;

            const img = document.getElementById('newsletter');
            img.src = imageUrl;

            img.onerror = function() {
                if (formatIndex < formats.length - 1) {
                    loadNewsletterImage(offsetWeeks, formatIndex + 1);
                } else if (offsetWeeks > -4) { // Try up to 4 weeks back
                    loadNewsletterImage(offsetWeeks - 1, 0);
                } else {
                    img.alt = "No newsletter available.";
                }
            };
        }

        loadNewsletterImage();
    </script>
</body>
</html>
