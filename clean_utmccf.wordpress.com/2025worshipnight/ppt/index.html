<!DOCTYPE html>
<html style="margin-top: 0px !important; scroll-padding-top: 0px !important;"  lang="en">
<head>
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/cn2t.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    try {
        var converter = OpenCC.Converter({ from: 'cn', to: 'tw' });
        var buttons = document.querySelectorAll(".simplified_to_traditional_translation a");
        if (!buttons || buttons.length === 0) return;
        
        var translatePage = function() {
            var rootNode = document.documentElement;
            rootNode.lang = 'zh-CN';
            var HTMLDict = OpenCC.HTMLConverter(converter, rootNode, 'zh-CN', 'zh-TW');
            HTMLDict.convert();
            buttons.forEach(function(btn) {
                btn.textContent = "简体";
                btn.onclick = function(e) {
                    e.preventDefault();
                    localStorage.setItem("lang_pref", "cn");
                    HTMLDict.restore();
                    buttons.forEach(function(b) {
                        b.textContent = "繁體";
                        b.onclick = function(e2) {
                            e2.preventDefault();
                            localStorage.setItem("lang_pref", "tw");
                            translatePage();
                        };
                    });
                };
            });
        };

        buttons.forEach(function(btn) {
            btn.href = "#";
            btn.onclick = function(e) {
                e.preventDefault();
                localStorage.setItem("lang_pref", "tw");
                translatePage();
            };
        });

        var pref = localStorage.getItem("lang_pref");
        if (pref === "tw") {
            translatePage();
        } else if (!pref) {
            var langs = navigator.languages || [navigator.language];
            for (var i = 0; i < langs.length; i++) {
                var lang = langs[i].toLowerCase();
                if (lang.includes("zh-tw") || lang.includes("zh-hk") || lang.includes("zh-hant") || lang.includes("zh-mo")) {
                    translatePage();
                    break;
                } else if (lang.includes("zh-cn") || lang.includes("zh-sg") || lang.includes("zh-hans")) {
                    break;
                }
            }
        }
    } catch (e) {
        console.error("OpenCC translation error: ", e);
    }
});
</script>
<link rel="stylesheet" href="/extra.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: black;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .slideshow {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            transition: transform 1s cubic-bezier(0.7, 0, 0.2, 1);
            z-index: 1;
        }
    </style>
</head>
<body style="margin-top: 0px !important;" >
    <div class="slideshow">
        <div class="slide" style="background-image: url('1.jpg');"></div>
        <div class="slide" style="background-image: url('2.jpg');"></div>
        <div class="slide" style="background-image: url('3.jpg');"></div>
        <div class="slide" style="background-image: url('4.jpg');"></div>
        <div class="slide" style="background-image: url('5.jpg');"></div>
        <div class="slide" style="background-image: url('6.jpg');"></div>
    </div>
    <script>
        const slides = document.querySelectorAll('.slide');
        let currentIndex = 0;
        let currentZIndex = 0;

        function showNextSlide() {
            if(currentIndex==0){

            }
            let nextIndex = (currentIndex + 1) % slides.length;
            let nextNextIndex = (currentIndex + 2) % slides.length
            console.log(currentIndex);
            slides[nextIndex].style.transform = 'translateX(100%)';
            slides[nextIndex].style.transition = 'none';
            currentZIndex+=1;
            slides[nextNextIndex].style.transform = 'translateX(100%)';
            slides[nextNextIndex].style.transition = 'none';

            slides[nextIndex].style.zIndex = currentZIndex;
            slides[nextNextIndex].style.zIndex = currentZIndex+1;
            
            requestAnimationFrame(() => {
                slides[nextIndex].style.transition = 'transform 1s cubic-bezier(0.7, 0, 0.2, 1)';
                slides[nextIndex].style.transform = 'translateX(0)';
            });
            currentIndex = nextIndex;
        }

        slides.forEach((slide, index) => {
            if (index !== 0) {
                slide.style.transform = 'translateX(100%)';
            }
        });

        setInterval(showNextSlide, 12000);
    </script>
</body>
</html>
